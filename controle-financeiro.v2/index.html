<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pontes Finanças: finanças pessoais e familiares. Um produto Pontes Dev." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Pontes Finanças</title>
    <script>
      // Tema antes do 1º desenho (sem piscar claro pra quem usa escuro). Mesma regra do useTema:
      // escolha salva, senão o sistema. Se entrar CSP no deploy, liberar este script por hash.
      (function () {
        var t = "claro"
        try {
          var s = localStorage.getItem("v2:tema")
          t = s === "claro" || s === "escuro" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro")
        } catch (e) {}
        document.documentElement.dataset.tema = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
