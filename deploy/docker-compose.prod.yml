# Produção na VPS. Quem sobe é o deploy automático (.github/workflows/deploy.yml): imagens prontas do GHCR com
# a tag = SHA do commit (VERSAO), sem build no servidor. Manual só em emergência (ver README.md).
# Segredos: .env (interpolação: POSTGRES_PASSWORD) e .env.api (só a API lê). Os dois são gerados NO
# servidor por scripts/segredos.sh e nunca entram no git (o deploy preserva os dois).
# Nenhuma porta pra fora: o proxy central da VPS (pasta E:\VSCode\pontes\servidor) faz o HTTPS e chama o
# pontes-web pela rede compartilhada "web". Postgres e API só na rede interna.
name: pontes

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pontes
      POSTGRES_USER: pontes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontes -d pontes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [interna]

  api:
    image: ghcr.io/gustavopontess/controle-financeiro-api:${VERSAO:?defina VERSAO}
    restart: unless-stopped
    env_file: .env.api
    environment:
      DATABASE_URL: "Host=postgres;Port=5432;Database=pontes;Username=pontes;Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: Production
      APP_URL: https://app.pontesdev.com.br
      CORS_ALLOWED_ORIGINS: https://app.pontesdev.com.br
    volumes:
      - apilogs:/app/logs
      # Chaves do ASP.NET Data Protection: sem volume, somem a cada atualização da imagem.
      - apikeys:/home/app/.aspnet/DataProtection-Keys
    # /health (sem login): a API respondendo. As migrações rodam no startup, antes de ouvir a porta,
    # então "saudável" já quer dizer "banco migrado". start_period cobre a migração da primeira subida.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  web:
    image: ghcr.io/gustavopontess/controle-financeiro-web:${VERSAO:?defina VERSAO}
    container_name: pontes-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks: [interna, web]

volumes:
  pgdata:
  apilogs:
  apikeys:

networks:
  interna:
  web:
    external: true
