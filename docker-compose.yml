services:
  postgres:
    image: postgres:16-alpine
    container_name: controlefinanceiro-db
    environment:
      POSTGRES_DB: controlefinanceiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controlefinanceiro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./ControleFinanceiro.Api
    # Host 5293 (porta de dev) -> container 8080. O SPA chama localhost:5293
    # (axiosConfig usa URL absoluta), entao o host precisa ser 5293.
    ports:
      - "5293:8080"
    environment:
      DATABASE_URL: "Host=postgres;Port=5432;Database=controlefinanceiro;Username=postgres;Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (min 32 chars; gere um forte — veja .env.example)}
      JWT_ISSUER: ControleFinanceiro
      JWT_AUDIENCE: ControleFinanceiroUsers
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://web
      # Production por padrao; CI/dev pode setar Development p/ o DevDataSeeder.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./controle-financeiro.web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
