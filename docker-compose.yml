services:
  postgres:
    image: postgres:16-alpine
    container_name: controlefinanceiro-db
    environment:
      POSTGRES_DB: controlefinanceiro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controlefinanceiro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./ControleFinanceiro.Api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "Host=postgres;Port=5432;Database=controlefinanceiro;Username=postgres;Password=postgres"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-mude-em-producao-min32chars}
      JWT_ISSUER: ControleFinanceiro
      JWT_AUDIENCE: ControleFinanceiroUsers
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://web
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./controle-financeiro.web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
