# Sobrescreve docker-compose.yml para usar Postgres.
# Requer issue #16 (Migrar SQLite -> Postgres) mergeada.
# Uso: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: controlefinanceiro
      POSTGRES_USER: ${POSTGRES_USER:-cf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cf_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cf_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    environment:
      DATABASE_URL: "Host=db;Database=controlefinanceiro;Username=${POSTGRES_USER:-cf_user};Password=${POSTGRES_PASSWORD:-cf_pass}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
