name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore controle-financeiro.sln

      - name: Build
        run: dotnet build controle-financeiro.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test controle-financeiro.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Node / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: controle-financeiro.web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: controle-financeiro.web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: controlefinanceiro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: Host=localhost;Port=5432;Database=controlefinanceiro;Username=postgres;Password=postgres
      JWT_SECRET: ci-secret-key-minimum-32-characters-long!
      JWT_ISSUER: ControleFinanceiro
      JWT_AUDIENCE: ControleFinanceiroUsers
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: controle-financeiro.web/package-lock.json

      - name: Install frontend dependencies
        working-directory: controle-financeiro.web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: controle-financeiro.web
        run: npx playwright install chromium --with-deps

      - name: Build backend
        run: dotnet build controle-financeiro.sln --configuration Release

      - name: Start backend
        run: |
          dotnet run --project ControleFinanceiro.Api --configuration Release &
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:5293/health && break
            sleep 2
          done

      - name: Run E2E tests
        working-directory: controle-financeiro.web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: controle-financeiro.web/playwright-report/
          retention-days: 7
