name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore controle-financeiro.sln

      - name: Build
        run: dotnet build controle-financeiro.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test controle-financeiro.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Node / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: controle-financeiro.web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: controle-financeiro.web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: controle-financeiro.web/package-lock.json

      - name: Install frontend dependencies
        working-directory: controle-financeiro.web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: controle-financeiro.web
        run: npx playwright install chromium --with-deps

      - name: Subir Postgres + API via docker compose
        env:
          # Development p/ o DevDataSeeder criar o usuario de teste (dev@controle.test)
          ASPNETCORE_ENVIRONMENT: Development
          JWT_SECRET: ci-secret-key-minimum-32-characters-long!
        run: |
          # Usa o MESMO docker-compose.yml do dev. API em container (host 5293),
          # roda migrations + seeders no startup. Postgres ja tem healthcheck.
          docker compose up -d --build postgres api
          echo "Aguardando API em http://localhost:5293/health ..."
          ok=""
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5293/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::API nao respondeu em /health apos 180s"
            docker compose logs api | tail -120
            exit 1
          fi
          echo "API no ar."

      - name: Run E2E tests
        working-directory: controle-financeiro.web
        run: npm run test:e2e

      - name: docker compose logs (se falhou)
        if: failure()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: controle-financeiro.web/playwright-report/
          retention-days: 7
