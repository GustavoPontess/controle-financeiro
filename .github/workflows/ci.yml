name: CI

on:
  push:
    branches: [main]
  # Todo PR roda o CI, não só os que apontam pra main — PR empilhado (base = outra branch) passava
  # sem nenhum teste (#285/#286 nunca tinham rodado). Os NOMES dos jobs não mudam (proteção da main).
  pull_request:

# Runner (2026-11-02): por padrão os do GitHub (ubuntu-latest). O GitHub Pro de estudante dá ~3.000 min Linux por mês
# (zera todo dia 1º) e o PC do Gustavo não precisa ficar ligado. Pra voltar pro runner do PC (self-hosted, rótulo
# pontes-local; ex.: se a cota acabar): variável do repositório RUNNER_CI=local (Settings > Secrets and variables >
# Actions > Variables). O repo é privado: PR de fora não roda código em nenhum dos dois.
#
# Banda (2026-10-27): no runner do PC os caches (NuGet, npm, .NET) ficam no disco dele (/dados, volume que sobrevive a
# recriar o container), NUNCA no cache remoto do GitHub (actions/cache): o cache do NuGet tem 1,9 GB e, baixado e
# subido a cada execução, consumiu 37 GB da internet de casa num dia. No runner do GitHub, cada execução começa limpa.
# Push novo na mesma branch cancela a execução anterior ainda na fila (concurrency).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# O front v1 e o E2E Playwright dele saíram em 2026-10-26 (tag arquivo/v1-final); E2E do front atual: ROADMAP.
jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ${{ vars.RUNNER_CI == 'local' && fromJSON('["self-hosted","pontes-local"]') || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7

      # No runner do PC, tudo no volume dele (/dados): o .NET instalado e os pacotes do NuGet ficam de uma execução pra
      # outra. No runner do GitHub, os caminhos padrão.
      - name: Caches no disco do runner do PC
        if: vars.RUNNER_CI == 'local'
        run: |
          echo "DOTNET_INSTALL_DIR=/dados/dotnet" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=/dados/nuget" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore controle-financeiro.sln

      - name: Build
        run: dotnet build controle-financeiro.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test controle-financeiro.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Node / Vite)
    runs-on: ${{ vars.RUNNER_CI == 'local' && fromJSON('["self-hosted","pontes-local"]') || 'ubuntu-latest' }}

    defaults:
      run:
        working-directory: controle-financeiro.web

    steps:
      - uses: actions/checkout@v7

      # No runner do PC, o cache do npm no volume dele (/dados), não no cache remoto do GitHub.
      - name: Cache do npm no disco do runner do PC
        if: vars.RUNNER_CI == 'local'
        run: echo "npm_config_cache=/dados/npm" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Sempre `npm ci` (instala exatamente o package-lock), nunca `npm install`.
      - name: Install dependencies
        run: npm ci

      # Confere a assinatura do registro npm de cada pacote instalado (pacote adulterado no caminho falha aqui).
      - name: Verify package signatures
        run: npm audit signatures

      - name: Test
        run: npm test

      # O build também roda a trava do admin fora do pacote (scripts/conferirAdminFora.mjs).
      - name: Build
        run: npm run build
