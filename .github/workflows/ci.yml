name: CI

on:
  push:
    branches: [main]
  # Todo PR roda o CI, não só os que apontam pra main — PR empilhado (base = outra branch) passava
  # sem nenhum teste (#285/#286 nunca tinham rodado). Os NOMES dos jobs não mudam (proteção da main).
  pull_request:

# Runner: a máquina do Gustavo (self-hosted, rótulo pontes-local), pra não depender dos minutos pagos do GitHub
# (2026-10-25, cobrança travou os jobs). O repo é privado: PR de fora não roda código lá.
#
# Banda (2026-10-27): o runner é um container no PC e roda UM job por vez. Os caches (NuGet, npm, .NET) ficam no disco
# do runner (/dados, volume que sobrevive a recriar o container), NUNCA no cache remoto do GitHub (actions/cache): o
# cache do NuGet tem 1,9 GB e, baixado e subido a cada execução, consumiu 37 GB da internet de casa num dia.
# Push novo na mesma branch cancela a execução anterior ainda na fila (concurrency).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# O front v1 e o E2E Playwright dele saíram em 2026-10-26 (tag arquivo/v1-final); E2E do front atual: ROADMAP.
jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: [self-hosted, pontes-local]
    # Tudo no volume do runner (/dados): o .NET instalado e os pacotes do NuGet ficam de uma execução pra outra.
    env:
      DOTNET_INSTALL_DIR: /dados/dotnet
      NUGET_PACKAGES: /dados/nuget

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore controle-financeiro.sln

      - name: Build
        run: dotnet build controle-financeiro.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test controle-financeiro.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Node / Vite)
    runs-on: [self-hosted, pontes-local]

    defaults:
      run:
        working-directory: controle-financeiro.web
    # Cache do npm no volume do runner (/dados), não no cache remoto do GitHub.
    env:
      npm_config_cache: /dados/npm

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Sempre `npm ci` (instala exatamente o package-lock), nunca `npm install`.
      - name: Install dependencies
        run: npm ci

      # Confere a assinatura do registro npm de cada pacote instalado (pacote adulterado no caminho falha aqui).
      - name: Verify package signatures
        run: npm audit signatures

      - name: Test
        run: npm test

      # O build também roda a trava do admin fora do pacote (scripts/conferirAdminFora.mjs).
      - name: Build
        run: npm run build
