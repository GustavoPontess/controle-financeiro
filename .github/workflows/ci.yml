name: CI

on:
  push:
    branches: [main]
  # Todo PR roda o CI, não só os que apontam pra main — PR empilhado (base = outra branch) passava
  # sem nenhum teste (#285/#286 nunca tinham rodado). Os NOMES dos jobs não mudam (proteção da main).
  pull_request:

# Runner: a máquina do Gustavo (self-hosted, rótulo pontes-local), pra não depender dos minutos pagos do GitHub
# (2026-10-25, cobrança travou os jobs). O repo é privado: PR de fora não roda código lá.
jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: [self-hosted, pontes-local]

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore controle-financeiro.sln

      - name: Build
        run: dotnet build controle-financeiro.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test controle-financeiro.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (Node / Vite)
    runs-on: [self-hosted, pontes-local]

    defaults:
      run:
        working-directory: controle-financeiro.web

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: controle-financeiro.web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend-v2:
    name: Frontend v2 (Node / Vite)
    runs-on: [self-hosted, pontes-local]

    defaults:
      run:
        working-directory: controle-financeiro.v2

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: controle-financeiro.v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E Playwright
    runs-on: [self-hosted, pontes-local]
    needs: [frontend]

    # Nível do job: todo `docker compose` (up/logs/down) precisa dessas vars pra
    # interpolar o compose (${POSTGRES_PASSWORD:?}/${JWT_SECRET:?}). Valores
    # efêmeros de CI (DB descartável) — não são segredos reais.
    env:
      ASPNETCORE_ENVIRONMENT: Development
      JWT_SECRET: ci-secret-key-minimum-32-characters-long!
      POSTGRES_PASSWORD: ci-postgres-pw
      # Na máquina do Gustavo: nome próprio pro compose, senão o `down -v` do fim apagaria o Postgres de dev dele
      # (mesma pasta = mesmo nome de projeto). Com o dev no ar (5432/5293 ocupadas), este job falha; não é obrigatório.
      COMPOSE_PROJECT_NAME: pontes-ci-e2e

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: controle-financeiro.web/package-lock.json

      - name: Install frontend dependencies
        working-directory: controle-financeiro.web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: controle-financeiro.web
        run: npx playwright install chromium  # sem --with-deps: pediria sudo na máquina do runner

      - name: Subir Postgres + API via docker compose
        run: |
          # Usa o MESMO docker-compose.yml do dev. API em container (host 5293),
          # roda migrations + seeders no startup. Postgres ja tem healthcheck.
          docker compose up -d --build postgres api
          echo "Aguardando API em http://localhost:5293/health ..."
          ok=""
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5293/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::API nao respondeu em /health apos 180s"
            docker compose logs api | tail -120
            exit 1
          fi
          echo "API no ar."

      - name: Run E2E tests
        working-directory: controle-financeiro.web
        run: npm run test:e2e

      - name: docker compose logs (se falhou)
        if: failure()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: controle-financeiro.web/playwright-report/
          retention-days: 7
