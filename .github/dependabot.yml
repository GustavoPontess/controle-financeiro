# Atualizações automáticas de dependência (npm do front, NuGet da API, actions do CI).
# Cada PR do Dependabot roda o CI no runner do PC (pontes-local): por isso semanal, agrupado e com poucos PRs abertos.
# `cooldown`: só propõe versão publicada há pelo menos 7 dias. Pacote malicioso costuma ser pego e retirado nesse
# tempo (ex.: campanha MALFEX / `imgdecode`, 2026-10). Correção de segurança (alerta do GitHub) não espera.
version: 2
updates:
  - package-ecosystem: npm
    directory: /controle-financeiro.web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      nuget-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
