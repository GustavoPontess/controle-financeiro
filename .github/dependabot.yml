# Atualizações automáticas de dependência (npm do front, NuGet da API, actions do CI).
# Cada PR do Dependabot roda o CI no runner do PC (pontes-local), na mesma fila do deploy. Por isso (2026-10-26,
# depois da 1ª leva de 5 PRs travar o deploy): UM PR por ecossistema, com tudo junto, e sem atualização GRANDE
# (versão major quebra código e é feita à mão, quando a gente decidir). Correção de segurança é outro fluxo (alertas
# do Dependabot) e não depende desta lista.
# `cooldown`: só propõe versão publicada há pelo menos 7 dias. Pacote malicioso costuma ser pego e retirado nesse
# tempo (ex.: campanha MALFEX / `imgdecode`, 2026-10).
version: 2
updates:
  - package-ecosystem: npm
    directory: /controle-financeiro.web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
