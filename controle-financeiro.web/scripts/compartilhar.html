<!doctype html>
<!-- Imagem que aparece quando alguém compartilha o link do app (WhatsApp, Instagram, LinkedIn...): 1200x630, gravada
     em public/compartilhar.jpg por `node scripts/compartilhar.mjs`. Cores e fonte do site público (src/site/site.css). -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #fffaf6; color: #22160f; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .arte { position: relative; box-sizing: border-box; height: 100%; padding: 64px 76px 58px; display: flex; flex-direction: column; overflow: hidden; }
  /* O brilho laranja do canto, como o topo do site. */
  .arte::before { content: ''; position: absolute; right: -220px; top: -260px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,106,31,.30) 0%, rgba(255,106,31,.10) 40%, rgba(255,106,31,0) 70%); }
  /* A ponte: um arco fino atravessando o fundo. */
  .arco { position: absolute; left: -40px; right: -40px; top: 40px; height: 230px; }
  .arte > *:not(.arco) { position: relative; }
  .marca { display: flex; align-items: center; gap: 14px; font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
  .marca svg { width: 60px; height: 60px; }
  h1 { margin: auto 0 0; max-width: 980px; font-size: 76px; line-height: 1.04; font-weight: 800; letter-spacing: -.035em; }
  h1 span { color: #e8590c; }
  .lede { margin: 22px 0 0; font-size: 28px; line-height: 1.35; font-weight: 500; color: #7a6557; max-width: 900px; }
  .pe { margin-top: 38px; display: flex; align-items: center; justify-content: space-between; font-size: 24px; font-weight: 700; }
  .pe .site::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 12px; border-radius: 50%; background: #ff6a1f; vertical-align: 2px; }
  .selos { display: flex; gap: 10px; }
  .selos span { padding: 9px 18px; border-radius: 99px; background: #fff; border: 1px solid #f1e3d8; font-size: 20px; font-weight: 600; color: #22160f; }
  .selos span:last-child { background: #22160f; border-color: #22160f; color: #ffe0cf; }
</style>
</head>
<body>
<div class="arte">
  <svg class="arco" viewBox="0 0 1280 260" preserveAspectRatio="none" fill="none" aria-hidden="true">
    <path d="M0 250 Q640 -40 1280 250" stroke="#ff6a1f" stroke-opacity=".22" stroke-width="3"/>
  </svg>
  <div class="marca">
    <svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#ff4f00"><path d="M27 26L8 50L27 74" stroke-width="8"/><path d="M73 26L92 50L73 74" stroke-width="8"/><path d="M59 14L41 86" stroke-width="8"/><path d="M18 64H82" stroke-width="5"/><path d="M57 22L24 64M55 30L34 64M58 22L80 64M56 30L70 64" stroke-width="2.2"/></svg>
    Pontes
  </div>
  <h1>Construa a ponte entre a sua casa e <span>o futuro dela.</span></h1>
  <p class="lede">Contas, cartões, o que é de cada um e o que vocês estão juntando. Pra decidir junto, sem briga e sem planilha.</p>
  <div class="pe">
    <span class="site">app.pontesdev.com.br</span>
    <span class="selos"><span>Casal</span><span>Família</span><span>Grátis no beta</span></span>
  </div>
</div>
</body>
</html>
