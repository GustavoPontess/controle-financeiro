server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Headers de segurança (prod) ──────────────────────────────────────────
    # Só afetam o SPA servido por este nginx; o dev (`npm run dev`/Vite) não passa
    # por aqui, então o HMR continua livre.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;                 # anti-clickjacking
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Content-Security-Policy do SPA. Build de produção do Vite usa scripts EXTERNOS
    # com hash (sem inline JS) → script-src 'self'. React injeta estilos inline
    # (style={{}}) → style-src precisa de 'unsafe-inline'. connect-src libera o backend.
    # ⚠️ connect-src aponta pro API desta stack (localhost:5293). Em produção real,
    # trocar pelo domínio do backend (e o axios baseURL também é hardcoded — ver
    # src/api/axiosConfig.ts). frame-ancestors 'none' = não pode ser embutido em iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:5293; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
