<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pontes: finanças pessoais e familiares." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Fonte do site público e das telas de acesso (a fonte em si só baixa quando a página usa). -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Pontes</title>
    <script>
      // Tema antes do 1º desenho (sem piscar claro pra quem usa escuro). Mesma regra do useTema:
      // escolha salva, senão o sistema. O CSP do Caddyfile libera este script pelo hash (scripts/conferirCspInline.mjs).
      (function () {
        var t = "claro"
        try {
          var s = localStorage.getItem("v2:tema")
          // Site público e telas de acesso abrem no claro sem escolha salva (decisão do Gustavo); o app segue o sistema.
          var publica = /^\/($|recursos|casa|contadores|planos|seguranca|sobre|entrar|cadastro|redefinir-senha|proteja-sua-conta)/.test(location.pathname)
          t = s === "claro" || s === "escuro" ? s : (!publica && matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro")
        } catch (e) {}
        document.documentElement.dataset.tema = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
