<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pontes: finanças pessoais e familiares." />
    <!-- Prévia do link (WhatsApp, Instagram, LinkedIn...). A arte é public/compartilhar.jpg (node scripts/compartilhar.mjs);
         o endereço precisa ser completo. Um card só pro app inteiro (é uma página só). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pontes" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://app.pontesdev.com.br/" />
    <meta property="og:title" content="Pontes · o dinheiro da casa, organizado pra casa decidir junto" />
    <meta property="og:description" content="Contas, cartões, o que é de cada um e o que vocês estão juntando. Pra decidir junto, sem briga e sem planilha." />
    <meta property="og:image" content="https://app.pontesdev.com.br/compartilhar.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Pontes: construa a ponte entre a sua casa e o futuro dela." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Fonte do site público e das telas de acesso (a fonte em si só baixa quando a página usa). -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Pontes</title>
    <script>
      // Tema antes do 1º desenho (sem piscar claro pra quem usa escuro). Mesma regra do useTema:
      // escolha salva, senão o sistema. O CSP do Caddyfile libera este script pelo hash (scripts/conferirCspInline.mjs).
      (function () {
        var t = "claro"
        try {
          var s = localStorage.getItem("v2:tema")
          // Site público e telas de acesso abrem no claro sem escolha salva (decisão do Gustavo); o app segue o sistema.
          var publica = /^\/($|recursos|casa|contadores|planos|seguranca|sobre|entrar|cadastro|redefinir-senha|confirmar-email|nao-fui-eu|nao-pedi-senha|proteja-sua-conta|termos-de-uso|privacidade)/.test(location.pathname)
          t = s === "claro" || s === "escuro" ? s : (!publica && matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro")
        } catch (e) {}
        document.documentElement.dataset.tema = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
